{% extends 'users/base.html' %}
{% load crispy_forms_tags %}

{% block body %}
<div class="container mt-5" style="max-width: 400px;">
  <div class="card shadow-sm p-4">
    <h2 class="mb-4 text-center">Edit Post</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary w-100">Update</button>
    </form>
    <form method="POST" action="{% url 'delete_post' post.id %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm w-100 btn-outline-danger" onclick="return confirm('Are you sure you want to delete this post?');">
            <i class="fa-solid fa-trash text-center"></i> Delete
        </button>
    </form>
  </div>
{% endblock %}
